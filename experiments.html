<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI For AI - Live Quantum Site & Tag Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070a11;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: #1e293b;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-magenta: #ec4899;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      height: 54px;
      padding: 0 16px;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--accent-green);
      font-family: 'JetBrains Mono', monospace;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Mobile View Toggle Switcher (Hidden on Desktop) */
    .mobile-nav-tabs {
      display: none;
      background: #0d121e;
      border-bottom: 1px solid var(--border);
      padding: 6px;
      gap: 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: bold;
    }

    /* Main Responsive Grid Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex-grow: 1;
      height: calc(100vh - 54px);
      position: relative;
      overflow: hidden;
    }

    /* Mobile Breakpoint Modifications */
    @media (max-width: 900px) {
      .mobile-nav-tabs {
        display: flex;
      }

      .app-layout {
        display: block;
        height: calc(100vh - 98px);
      }

      .iframe-container, .visualizer-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        display: none;
      }

      .iframe-container.active-view, .visualizer-container.active-view {
        display: flex !important;
      }
    }

    /* Left Frame (Your Website) */
    .iframe-container {
      width: 100%;
      height: 100%;
      border-right: 1px solid var(--border);
      background: #ffffff;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Right Viewport (Canvas + Controls + Log Overlay) */
    .visualizer-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0f172a 0%, #070a11 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Control Toolbar above Canvas */
    .toolbar {
      background: rgba(13, 18, 30, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 5;
      flex-shrink: 0;
    }

    .toolbar::-webkit-scrollbar { height: 4px; }
    .toolbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .btn-sm {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-sm:active { transform: scale(0.96); }

    .btn-reset {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-calc { border-color: rgba(6, 182, 212, 0.5); color: var(--accent-cyan); }
    .btn-lead { border-color: rgba(236, 72, 153, 0.5); color: var(--accent-magenta); }
    .btn-state { border-color: rgba(139, 92, 246, 0.5); color: var(--accent-purple); }

    .canvas-wrapper {
      position: relative;
      flex-grow: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .canvas-overlay-hint {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      color: var(--text-muted);
      pointer-events: none;
      font-family: 'JetBrains Mono', monospace;
      max-width: calc(100% - 20px);
    }

    /* Telemetry Drawer Overlay at Bottom */
    .telemetry-drawer {
      height: 150px;
      background: rgba(13, 18, 30, 0.95);
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .log-stream {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-grow: 1;
    }

    .log-item {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--accent-cyan);
      padding: 5px 8px;
      border-radius: 4px;
      animation: fadeIn 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-tag { color: var(--accent-cyan); font-weight: bold; }
    .log-calc { color: var(--accent-green); }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="logo">
      <span>AI•{}</span> Quantum Visualizer
    </div>
    <div class="status-badge">
      <div class="pulse-dot"></div>
      Active Engine
    </div>
  </header>

  <!-- Mobile Tab Switcher (Only visible on small screens) -->
  <div class="mobile-nav-tabs">
    <button class="tab-btn active" id="tabSite" onclick="switchMobileTab('site')">🌐 Website View</button>
    <button class="tab-btn" id="tabCanvas" onclick="switchMobileTab('canvas')">✨ Quantum Dots (<span id="mobileDotCount">0</span>)</button>
  </div>

  <div class="app-layout">
    
    <!-- LEFT: Embedded Website Frame -->
    <div class="iframe-container active-view" id="siteContainer">
      <!-- REPLACE WITH YOUR ACTUAL WEBSITE URL BELOW -->
      <iframe src="https://rocketry-team.vercel.app" id="siteFrame"></iframe>
    </div>

    <!-- RIGHT: 2D Quantum Canvas & Controls -->
    <div class="visualizer-container" id="canvasContainer">
      
      <!-- Interactive Mobile/Desktop Toolbar -->
      <div class="toolbar">
        <button class="btn-sm btn-reset" id="btnReset">
          <span>🧹 Reset</span>
        </button>
        <button class="btn-sm" id="btnPause">
          <span id="pauseLabel">⏸️ Pause</span>
        </button>
        <button class="btn-sm btn-calc" id="btnTagCalc">
          <span>+ AI•{calc}</span>
        </button>
        <button class="btn-sm btn-lead" id="btnTagLead">
          <span>+ AI•{lead}</span>
        </button>
        <button class="btn-sm btn-state" id="btnTagState">
          <span>+ AI•{state}</span>
        </button>
      </div>

      <div class="canvas-wrapper">
        <div class="canvas-overlay-hint">
          ⚡ Tap site or canvas to tag data
        </div>
        <canvas id="quantumCanvas"></canvas>
      </div>

      <!-- Telemetry Drawer -->
      <div class="telemetry-drawer">
        <div class="drawer-header">
          <span>AI• Pipeline Telemetry</span>
          <span id="nodeCount">0 Quantum Dots</span>
        </div>
        <div class="log-stream" id="logStream">
          <div class="log-item" style="border-left-color: var(--accent-purple);">
            <span>System ready. Waiting for site events...</span>
            <span style="color: #64748b;">NOW</span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Mobile Tab Switching Handler
    function switchMobileTab(tab) {
      const siteContainer = document.getElementById('siteContainer');
      const canvasContainer = document.getElementById('canvasContainer');
      const tabSite = document.getElementById('tabSite');
      const tabCanvas = document.getElementById('tabCanvas');

      if (tab === 'site') {
        siteContainer.classList.add('active-view');
        canvasContainer.classList.remove('active-view');
        tabSite.classList.add('active');
        tabCanvas.classList.remove('active');
      } else {
        canvasContainer.classList.add('active-view');
        siteContainer.classList.remove('active-view');
        tabCanvas.classList.add('active');
        tabSite.classList.remove('active');
        window.triggerCanvasResize(); // Ensure canvas matches mobile screen dimensions
      }
    }

    (function() {
      const canvas = document.getElementById('quantumCanvas');
      const ctx = canvas.getContext('2d');
      const logStream = document.getElementById('logStream');
      const nodeCountEl = document.getElementById('nodeCount');
      const mobileDotCount = document.getElementById('mobileDotCount');
      const pauseLabel = document.getElementById('pauseLabel');

      let width, height;
      let nodes = [];
      let time = 0;
      let isPaused = false;

      const TAG_COLORS = {
        calc: '#06b6d4',          // Cyan
        click: '#f59e0b',         // Amber
        lead: '#ec4899',          // Magenta
        superposition: '#8b5cf6', // Purple
        default: '#10b981'        // Green
      };

      function resize() {
        const wrapper = canvas.parentElement;
        if (!wrapper) return;
        width = canvas.width = wrapper.clientWidth;
        height = canvas.height = wrapper.clientHeight;
      }
      window.addEventListener('resize', resize);
      window.triggerCanvasResize = resize;
      resize();

      function parseCalcTag(tagStr) {
        const match = tagStr.match(/calc:\s*([^}]+)/);
        if (!match) return null;
        const expr = match[1];
        try {
          const sanitized = expr.replace(/[^0-9+\-*/().^]/g, '').replace(/\^/g, '**');
          const result = Function(`"use strict"; return (${sanitized})`)();
          return { expr, result };
        } catch (e) {
          return { expr, result: 'Error' };
        }
      }

      function spawnQuantumDot(tagStr, customX = null, customY = null) {
        const type = tagStr.includes('calc:') ? 'calc' :
                     tagStr.includes('click') ? 'click' :
                     tagStr.includes('lead') || tagStr.includes('submit') ? 'lead' :
                     tagStr.includes('superposition') || tagStr.includes('state') ? 'superposition' : 'default';

        const calcRes = parseCalcTag(tagStr);

        const node = {
          id: Math.random().toString(36).substr(2, 9),
          x: customX !== null ? customX : Math.random() * Math.max(100, width - 80) + 40,
          y: customY !== null ? customY : Math.random() * Math.max(100, height - 80) + 40,
          vx: (Math.random() - 0.5) * 0.9,
          vy: (Math.random() - 0.5) * 0.9,
          radius: 6,
          color: TAG_COLORS[type] || TAG_COLORS.default,
          tag: tagStr,
          type: type,
          calcResult: calcRes,
          wavePhase: Math.random() * Math.PI * 2
        };

        nodes.push(node);
        if (nodes.length > 20) nodes.shift();

        logTelemetry(tagStr, calcRes);
        updateCount();
      }

      function logTelemetry(tagStr, calcRes) {
        const item = document.createElement('div');
        item.className = 'log-item';
        
        let calcHTML = '';
        if (calcRes) {
          calcHTML = ` <span class="log-calc">➔ Evaluated: ${calcRes.expr} = ${calcRes.result}</span>`;
        }

        item.innerHTML = `
          <div><span class="log-tag">${tagStr}</span>${calcHTML}</div>
          <span style="color: #64748b; font-size: 0.65rem;">${new Date().toLocaleTimeString()}</span>
        `;
        logStream.prepend(item);
      }

      function updateCount() {
        const text = `${nodes.length} Dots`;
        nodeCountEl.innerText = text;
        if (mobileDotCount) mobileDotCount.innerText = nodes.length;
      }

      // LISTEN FOR MESSAGES FROM EMBEDDED WEBSITE TRACKING SNIPPET
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'AI_TAG_EVENT') {
          spawnQuantumDot(event.data.tag || 'AI•{event: interaction}');
        }
      });

      // BUTTON HANDLERS
      document.getElementById('btnReset').addEventListener('click', function() {
        nodes = [];
        updateCount();
        logStream.innerHTML = '<div class="log-item" style="border-left-color: var(--accent-red);"><span>Canvas cleared.</span></div>';
      });

      document.getElementById('btnPause').addEventListener('click', function() {
        isPaused = !isPaused;
        pauseLabel.innerText = isPaused ? '▶️ Resume' : '⏸️ Pause';
      });

      document.getElementById('btnTagCalc').addEventListener('click', function() {
        const a = Math.floor(Math.random() * 50) + 10;
        const b = Math.floor(Math.random() * 8) + 2;
        spawnQuantumDot(`AI•{event: calculation, calc: ${a} * ${b}}`);
      });

      document.getElementById('btnTagLead').addEventListener('click', function() {
        spawnQuantumDot('AI•{event: lead_captured, priority: "high"}');
      });

      document.getElementById('btnTagState').addEventListener('click', function() {
        spawnQuantumDot('AI•{state: superposition, weight: 0.95}');
      });

      // Canvas Physics & Wave Renderer
      function render() {
        if (!isPaused) {
          time += 0.03;
        }

        ctx.clearRect(0, 0, width, height);

        // Grid Background
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.25)';
        ctx.lineWidth = 1;
        const gridSize = 35;
        for (let x = 0; x < width; x += gridSize) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y < height; y += gridSize) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        // Entanglement Beams
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const n1 = nodes[i];
            const n2 = nodes[j];
            const dx = n2.x - n1.x;
            const dy = n2.y - n1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 150) {
              const alpha = (1 - dist / 150) * 0.45;
              ctx.strokeStyle = n1.color;
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.stroke();
              ctx.globalAlpha = 1.0;
            }
          }
        }

        // Quantum Dots & Waves
        nodes.forEach(node => {
          if (!isPaused) {
            node.x += node.vx;
            node.y += node.vy;

            if (node.x < 20 || node.x > width - 20) node.vx *= -1;
            if (node.y < 20 || node.y > height - 20) node.vy *= -1;
          }

          // Wave rings
          for (let r = 1; r <= 3; r++) {
            const waveRadius = (time * 25 + r * 20 + node.wavePhase * 10) % 80;
            const alpha = Math.max(0, 1 - waveRadius / 80) * 0.35;

            ctx.strokeStyle = node.color;
            ctx.lineWidth = 1;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(node.x, node.y, waveRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }

          // Core Dot
          ctx.fillStyle = node.color;
          ctx.shadowColor = node.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Tag Text Label
          ctx.fillStyle = '#ffffff';
          ctx.font = '10px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          const label = node.calcResult ? `${node.tag} = ${node.calcResult.result}` : node.tag;
          ctx.fillText(label, node.x, node.y - 10);
        });

        requestAnimationFrame(render);
      }

      // Initial Quantum Dot
      spawnQuantumDot('AI•{state: superposition, engine: ready}');

      render();

      // Touch & Mouse Click Canvas Handler
      canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spawnQuantumDot(`AI•{tap: [${Math.round(x)},${Math.round(y)}]`, x, y);
      });

    })();
  </script>
</body>
</html>
