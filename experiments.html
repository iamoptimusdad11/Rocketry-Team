<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI For AI - Live Site & Superposition Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070a11;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: #1e293b;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-magenta: #ec4899;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 54px;
      padding: 0 20px;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--accent-green);
      font-family: 'JetBrains Mono', monospace;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Split Screen Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex-grow: 1;
      height: calc(100vh - 54px);
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    /* Left Frame (Your Website) */
    .iframe-container {
      width: 100%;
      height: 100%;
      border-right: 1px solid var(--border);
      background: #ffffff;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Right Viewport (Canvas + Controls + Log Overlay) */
    .visualizer-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0f172a 0%, #070a11 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Control Toolbar above Canvas */
    .toolbar {
      background: rgba(13, 18, 30, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 5;
    }

    .btn-sm {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-cyan);
      transform: translateY(-1px);
    }

    .btn-reset {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-reset:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .btn-calc { border-color: rgba(6, 182, 212, 0.5); color: var(--accent-cyan); }
    .btn-lead { border-color: rgba(236, 72, 153, 0.5); color: var(--accent-magenta); }
    .btn-state { border-color: rgba(139, 92, 246, 0.5); color: var(--accent-purple); }

    .canvas-wrapper {
      position: relative;
      flex-grow: 1;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .canvas-overlay-hint {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--text-muted);
      pointer-events: none;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Telemetry Drawer Overlay at Bottom */
    .telemetry-drawer {
      height: 170px;
      background: rgba(13, 18, 30, 0.92);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .log-stream {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.73rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-grow: 1;
    }

    .log-item {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--accent-cyan);
      padding: 5px 8px;
      border-radius: 4px;
      animation: fadeIn 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-tag {
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .log-calc {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>AI•{}</span> Live Quantum Visualizer
    </div>
    <div class="status-badge">
      <div class="pulse-dot"></div>
      Superposition Wave Engine Active
    </div>
  </header>

  <div class="app-layout">
    
    <!-- LEFT: Embedded Website Frame -->
    <div class="iframe-container">
      <!-- REPLACE WITH YOUR ACTUAL WEBSITE URL BELOW -->
      <iframe src="https://rocketry-team.vercel.app" id="siteFrame"></iframe>
    </div>

    <!-- RIGHT: 2D Quantum Canvas & Control Toolbar -->
    <div class="visualizer-container">
      
      <!-- Interactive Toolbar -->
      <div class="toolbar">
        <button class="btn-sm btn-reset" id="btnReset">
          <span>🧹 Reset Dots</span>
        </button>
        <button class="btn-sm" id="btnPause">
          <span id="pauseLabel">⏸️ Pause Motion</span>
        </button>
        <button class="btn-sm btn-calc" id="btnTagCalc">
          <span>+ AI•{calc}</span>
        </button>
        <button class="btn-sm btn-lead" id="btnTagLead">
          <span>+ AI•{lead}</span>
        </button>
        <button class="btn-sm btn-state" id="btnTagState">
          <span>+ AI•{superposition}</span>
        </button>
      </div>

      <div class="canvas-wrapper">
        <div class="canvas-overlay-hint">
          ⚡ Click site (Left) or canvas (Right) to tag data
        </div>
        <canvas id="quantumCanvas"></canvas>
      </div>

      <!-- Telemetry Stream Output -->
      <div class="telemetry-drawer">
        <div class="drawer-header">
          <span>AI• Pipeline Telemetry</span>
          <span id="nodeCount">0 Quantum Dots</span>
        </div>
        <div class="log-stream" id="logStream">
          <div class="log-item" style="border-left-color: var(--accent-purple);">
            <span>System ready. Waiting for live website events...</span>
            <span style="color: #64748b;">NOW</span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    (function() {
      const canvas = document.getElementById('quantumCanvas');
      const ctx = canvas.getContext('2d');
      const logStream = document.getElementById('logStream');
      const nodeCountEl = document.getElementById('nodeCount');
      const pauseLabel = document.getElementById('pauseLabel');

      let width, height;
      let nodes = [];
      let time = 0;
      let isPaused = false;

      const TAG_COLORS = {
        calc: '#06b6d4',          // Cyan
        click: '#f59e0b',         // Amber
        lead: '#ec4899',          // Magenta
        superposition: '#8b5cf6', // Purple
        default: '#10b981'        // Green
      };

      function resize() {
        const wrapper = canvas.parentElement;
        width = canvas.width = wrapper.clientWidth;
        height = canvas.height = wrapper.clientHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function parseCalcTag(tagStr) {
        const match = tagStr.match(/calc:\s*([^}]+)/);
        if (!match) return null;
        const expr = match[1];
        try {
          const sanitized = expr.replace(/[^0-9+\-*/().^]/g, '').replace(/\^/g, '**');
          const result = Function(`"use strict"; return (${sanitized})`)();
          return { expr, result };
        } catch (e) {
          return { expr, result: 'Error' };
        }
      }

      function spawnQuantumDot(tagStr, customX = null, customY = null) {
        const type = tagStr.includes('calc:') ? 'calc' :
                     tagStr.includes('click') ? 'click' :
                     tagStr.includes('lead') || tagStr.includes('submit') ? 'lead' :
                     tagStr.includes('superposition') ? 'superposition' : 'default';

        const calcRes = parseCalcTag(tagStr);

        const node = {
          id: Math.random().toString(36).substr(2, 9),
          x: customX !== null ? customX : Math.random() * (width - 120) + 60,
          y: customY !== null ? customY : Math.random() * (height - 120) + 60,
          vx: (Math.random() - 0.5) * 0.9,
          vy: (Math.random() - 0.5) * 0.9,
          radius: 6,
          color: TAG_COLORS[type] || TAG_COLORS.default,
          tag: tagStr,
          type: type,
          calcResult: calcRes,
          wavePhase: Math.random() * Math.PI * 2
        };

        nodes.push(node);
        if (nodes.length > 25) nodes.shift();

        logTelemetry(tagStr, calcRes);
        updateCount();
      }

      function logTelemetry(tagStr, calcRes) {
        const item = document.createElement('div');
        item.className = 'log-item';
        
        let calcHTML = '';
        if (calcRes) {
          calcHTML = ` <span class="log-calc">➔ Evaluated: ${calcRes.expr} = ${calcRes.result}</span>`;
        }

        item.innerHTML = `
          <div><span class="log-tag">${tagStr}</span>${calcHTML}</div>
          <span style="color: #64748b; font-size: 0.65rem;">${new Date().toLocaleTimeString()}</span>
        `;
        logStream.prepend(item);
      }

      function updateCount() {
        nodeCountEl.innerText = `${nodes.length} Quantum Dots`;
      }

      // LISTEN FOR MESSAGES FROM EMBEDDED WEBSITE TRACKING SNIPPET
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'AI_TAG_EVENT') {
          spawnQuantumDot(event.data.tag || 'AI•{event: interaction}');
        }
      });

      // BUTTON HANDLERS
      document.getElementById('btnReset').addEventListener('click', function() {
        nodes = [];
        updateCount();
        logStream.innerHTML = '<div class="log-item" style="border-left-color: var(--accent-red);"><span>Canvas reset. All dots cleared.</span></div>';
      });

      document.getElementById('btnPause').addEventListener('click', function() {
        isPaused = !isPaused;
        pauseLabel.innerText = isPaused ? '▶️ Resume Motion' : '⏸️ Pause Motion';
      });

      document.getElementById('btnTagCalc').addEventListener('click', function() {
        const a = Math.floor(Math.random() * 50) + 10;
        const b = Math.floor(Math.random() * 8) + 2;
        spawnQuantumDot(`AI•{event: calculation, calc: ${a} * ${b}}`);
      });

      document.getElementById('btnTagLead').addEventListener('click', function() {
        spawnQuantumDot('AI•{event: lead_captured, priority: "high", state: superposition}');
      });

      document.getElementById('btnTagState').addEventListener('click', function() {
        spawnQuantumDot('AI•{state: quantum_superposition, weight: 0.95}');
      });

      // Canvas Renderer Loop
      function render() {
        if (!isPaused) {
          time += 0.03;
        }

        ctx.clearRect(0, 0, width, height);

        // Grid Background
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.25)';
        ctx.lineWidth = 1;
        const gridSize = 40;
        for (let x = 0; x < width; x += gridSize) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y < height; y += gridSize) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        // Entanglement Beams
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const n1 = nodes[i];
            const n2 = nodes[j];
            const dx = n2.x - n1.x;
            const dy = n2.y - n1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 170) {
              const alpha = (1 - dist / 170) * 0.45;
              ctx.strokeStyle = n1.color;
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.stroke();
              ctx.globalAlpha = 1.0;
            }
          }
        }

        // Quantum Dots & Waves
        nodes.forEach(node => {
          if (!isPaused) {
            node.x += node.vx;
            node.y += node.vy;

            if (node.x < 30 || node.x > width - 30) node.vx *= -1;
            if (node.y < 30 || node.y > height - 30) node.vy *= -1;
          }

          // Wave rings
          for (let r = 1; r <= 3; r++) {
            const waveRadius = (time * 25 + r * 20 + node.wavePhase * 10) % 90;
            const alpha = Math.max(0, 1 - waveRadius / 90) * 0.35;

            ctx.strokeStyle = node.color;
            ctx.lineWidth = 1;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(node.x, node.y, waveRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }

          // Core Dot
          ctx.fillStyle = node.color;
          ctx.shadowColor = node.color;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Tag Label
          ctx.fillStyle = '#ffffff';
          ctx.font = '10px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          const label = node.calcResult ? `${node.tag} = ${node.calcResult.result}` : node.tag;
          ctx.fillText(label, node.x, node.y - 12);
        });

        requestAnimationFrame(render);
      }

      // Initial Node
      spawnQuantumDot('AI•{state: superposition, engine: ready}');

      render();

      // Manual Canvas Click
      canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spawnQuantumDot(`AI•{manual_tag: [${Math.round(x)},${Math.round(y)}]`, x, y);
      });

    })();
  </script>
</body>
</html>
