name: Ephemeral Difference Imaging

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs automatically every 10 minutes
  workflow_dispatch:     # Retains manual "Run workflow" button

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # Prevents overlapping runs and race conditions

permissions:
  contents: write

jobs:
  difference-imaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Science Libraries
        run: |
          pip install astroquery astropy reproject numpy pillow scipy pandas

      - name: Run Ephemeral Subtraction Pipeline
        run: python scripts/process_ephemeral.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Telemetry update & transient difference log [skip ci]"
          branch: main
          file_pattern: data/*.png data/telemetry.json data/archive.json data/subtracted_transient_difference.csv
