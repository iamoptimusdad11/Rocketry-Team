name: Ephemeral Difference Imaging

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at the top of every hour
  workflow_dispatch:     # Retains manual "Run workflow" button

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  difference-imaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Science Libraries
        run: |
          pip install astroquery astropy reproject numpy pillow scipy pandas

      - name: Run Ephemeral Subtraction Pipeline
        run: python scripts/process_ephemeral.py

      - name: Commit and Push Web Outputs & CSV Log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.png data/telemetry.json data/archive.json data/subtracted_transient_difference.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Hourly telemetry update & transient difference log [skip ci]"
          git pull origin main --rebase
          git push origin main
