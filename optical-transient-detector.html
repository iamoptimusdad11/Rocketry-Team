<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Optical Transient Detector | Limitless Rocketry</title>
  <link rel="stylesheet" href="mission-control.css">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 17, 23, 0.85);
      --accent-cyan: #00f0ff;
      --accent-orange: #ff6b00;
      --text-main: #e6edf3;
      --text-muted: #8b949e;
      --font-mono: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Navigation Styling */
    .navbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(7, 9, 14, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar ul {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1rem;
      padding: 0;
      margin: 0.5rem 0 0 0;
      list-style: none;
    }

    .navbar a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .navbar a:active, .navbar a.active {
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
    }

    /* Container & Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      box-sizing: border-box;
    }

    .detector-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .detector-header h1 {
      font-family: var(--font-mono);
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      color: var(--accent-cyan);
      margin: 0 0 0.5rem 0;
      letter-spacing: 1px;
    }

    .detector-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* Grid System */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 900px) {
      .main-grid {
        grid-template-columns: 2fr 1fr;
      }
    }

    /* Viewport Panel */
    .viewport-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      padding: 1rem;
      box-sizing: border-box;
    }

    .viewport-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .btn-toggle {
      flex: 1 1 calc(33.33% - 0.5rem);
      min-width: 90px;
      padding: 0.6rem 0.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
    }

    .btn-toggle.active {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Canvas Frame Display */
    .image-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      position: relative;
      width: 100%;
      min-height: 280px;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    @media (min-width: 600px) {
      .image-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .image-grid.blink-mode {
      grid-template-columns: 1fr;
    }

    .frame-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame-container.hidden {
      display: none !important;
    }

    .frame-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      z-index: 10;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .space-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Target Reticle Overlay */
    .target-overlay {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid var(--accent-orange);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      z-index: 5;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 107, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
    }

    /* Telemetry Panel */
    .panel-right {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.4rem;
    }

    .alert-card {
      background: rgba(255, 107, 0, 0.08);
      border: 1px solid rgba(255, 107, 0, 0.3);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    .alert-card .title {
      color: var(--accent-orange);
      font-weight: bold;
      display: block;
      margin-bottom: 0.3rem;
    }

    .alert-card .meta {
      color: var(--text-muted);
      font-size: 0.75rem;
      display: block;
    }

    .btn-primary {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent-cyan);
      color: #000;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 0.85rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.2s ease;
      margin-top: auto;
    }

    .btn-primary:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <span style="font-family: var(--font-mono); color: var(--accent-cyan); font-weight: bold;">LIMITLESS ROCKETRY</span>
    </div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="mission-control.html">Control</a></li>
      <li><a href="ai-laboratory.html">AI Lab</a></li>
      <li><a href="seti.html">SETI</a></li>
      <li><a href="optical-transient-detector.html" class="active">OTD</a></li>
      <li><a href="team.html">Team</a></li>
    </ul>
  </nav>

  <div class="container">
    <header class="detector-header">
      <h1>OPTICAL TRANSIENT DETECTOR</h1>
      <p>PSF-Matched Difference Imaging & Anomaly Detection Pipeline</p>
    </header>

    <div class="main-grid">
      <!-- Left Column: Image Canvas & Viewport -->
      <div class="viewport-panel">
        <div class="viewport-controls">
          <button id="btn-split" class="btn-toggle active">SPLIT</button>
          <button id="btn-blink" class="btn-toggle">BLINK</button>
          <button id="btn-diff" class="btn-toggle">DIFF ONLY</button>
        </div>

        <div id="grid" class="image-grid">
          <div id="frame-a" class="frame-container">
            <div class="frame-tag" id="tag-a">HST // OPTICAL</div>
            <img id="img-a" src="data/hst_aligned.png" class="space-canvas" alt="HST Frame" />
          </div>
          <div id="frame-b" class="frame-container">
            <div class="frame-tag" id="tag-b">JWST // IR</div>
            <div class="target-overlay" id="reticle"></div>
            <img id="img-b" src="data/jwst.png" class="space-canvas" alt="JWST Frame" />
          </div>
        </div>
      </div>

      <!-- Right Column: Control & Telemetry -->
      <div class="panel-right">
        <div class="panel-title">Detection Telemetry</div>

        <div id="telemetry-content">
          <div class="alert-card">
            <span class="title">READY FOR FETCH</span>
            <span class="meta">SYSTEM STATUS: IDLE</span>
            <span class="meta">PIPELINE: STANDBY</span>
          </div>
        </div>

        <button class="btn-primary" id="btn-execute">EXECUTE SUBTRACTION</button>
      </div>
    </div>
  </div>

  <script>
    const btnSplit = document.getElementById('btn-split');
    const btnBlink = document.getElementById('btn-blink');
    const btnDiff  = document.getElementById('btn-diff');
    const grid     = document.getElementById('grid');
    const frameA   = document.getElementById('frame-a');
    const frameB   = document.getElementById('frame-b');
    const imgA     = document.getElementById('img-a');
    const imgB     = document.getElementById('img-b');
    const tagB     = document.getElementById('tag-b');
    const executeBtn = document.getElementById('btn-execute');
    const telemetryContainer = document.getElementById('telemetry-content');
    const reticle  = document.getElementById('reticle');

    let blinkInterval = null;
    let telemetryCache = null;

    // Helper to format clean relative image URLs
    function formatImagePath(pathStr) {
      if (!pathStr) return 'data/hst_aligned.png';
      let clean = pathStr.replace(/^\/+/, '').replace(/^docs\//, '');
      if (!clean.startsWith('data/')) {
        clean = 'data/' + clean;
      }
      return clean;
    }

    // Viewport Mode Toggles
    btnSplit.addEventListener('click', () => {
      stopBlink();
      setActiveBtn(btnSplit);
      grid.className = 'image-grid';
      frameA.classList.remove('hidden');
      frameB.classList.remove('hidden');
      if (telemetryCache) {
        imgB.src = formatImagePath(telemetryCache.jwst_img);
        tagB.innerText = "JWST // PSF-MATCHED IR";
      }
    });

    btnBlink.addEventListener('click', () => {
      setActiveBtn(btnBlink);
      grid.className = 'image-grid blink-mode';
      if (telemetryCache) {
        imgB.src = formatImagePath(telemetryCache.jwst_img);
        tagB.innerText = "JWST // PSF-MATCHED IR";
      }
      startBlink();
    });

    btnDiff.addEventListener('click', () => {
      stopBlink();
      setActiveBtn(btnDiff);
      grid.className = 'image-grid blink-mode';
      frameA.classList.add('hidden');
      frameB.classList.remove('hidden');
      if (telemetryCache && telemetryCache.diff_img) {
        imgB.src = formatImagePath(telemetryCache.diff_img);
        tagB.innerText = "DIFFERENCE MAP";
      }
    });

    function setActiveBtn(btn) {
      [btnSplit, btnBlink, btnDiff].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function startBlink() {
      stopBlink();
      let visible = 0;
      blinkInterval = setInterval(() => {
        if (visible === 0) {
          frameA.classList.remove('hidden');
          frameB.classList.add('hidden');
          visible = 1;
        } else {
          frameA.classList.add('hidden');
          frameB.classList.remove('hidden');
          visible = 0;
        }
      }, 500);
    }

    function stopBlink() {
      if (blinkInterval) clearInterval(blinkInterval);
    }

    // Execution & Data Fetch
    executeBtn.addEventListener('click', async () => {
      try {
        executeBtn.innerText = "LOADING TELEMETRY...";
        const res = await fetch('data/telemetry.json?t=' + Date.now());
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} - ${res.statusText}`);
        }

        telemetryCache = await res.json();

        // 1. Update Image Sources
        imgA.src = formatImagePath(telemetryCache.hst_img);
        imgB.src = formatImagePath(telemetryCache.jwst_img);

        // 2. Position Overlay Reticle
        if (telemetryCache.anomalies_found > 0 && telemetryCache.targets && telemetryCache.targets.length > 0) {
          const target = telemetryCache.targets[0];
          reticle.style.left = `${(target.pixel_x / 400) * 100}%`;
          reticle.style.top = `${(target.pixel_y / 400) * 100}%`;
          reticle.style.display = 'block';
        } else {
          reticle.style.display = 'none';
        }

        // 3. Populate Telemetry Panel
        telemetryContainer.innerHTML = `
          <div class="alert-card">
            <span class="title">${telemetryCache.anomalies_found > 0 ? 'ANOMALY DETECTED' : 'NO ANOMALIES'}</span>
            <span class="meta">PSF MATCHING: ${telemetryCache.psf_matching_applied ? 'APPLIED' : 'OFF'}</span>
            <span class="meta">KERNEL STDDEV: ${telemetryCache.kernel_stddev}</span>
            <span style="color: var(--accent-orange); margin-top:0.2rem; display:block;">
              SIGMA PEAK: ${telemetryCache.targets[0]?.peak_flux_sigma || 0}σ
            </span>
          </div>

          <div class="panel-title" style="margin-top: 0.8rem;">Pipeline Specs</div>
          <div style="font-family: var(--font-mono); font-size: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem; color: var(--text-muted);">
            <div>Threshold: <span style="color:var(--text-main)">${telemetryCache.sigma_threshold}σ</span></div>
            <div>Targets Found: <span style="color:var(--accent-cyan)">${telemetryCache.anomalies_found}</span></div>
          </div>
        `;

        executeBtn.innerText = "EXECUTE SUBTRACTION";
      } catch (err) {
        console.error("Pipeline Execution Error:", err);
        executeBtn.innerText = "ERROR LOADING DATA";
        telemetryContainer.innerHTML = `
          <div class="alert-card" style="border-color: #ff0055; background: rgba(ff, 0, 85, 0.1);">
            <span class="title" style="color: #ff0055;">FETCH ERROR</span>
            <span class="meta">Could not read data/telemetry.json</span>
            <span class="meta">Check console for details.</span>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
